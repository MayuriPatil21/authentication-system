
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2ff;
            color: #1f2937;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        main {
            max-width: 700px;
            margin: 60px auto;
            padding: 30px;
            width: 90%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px #00000015;
            text-align: center;
        }

        button {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }
    </style>
</head>
<body>
    <header>
        <h2>My Dashboard</h2>
        <button id="logoutButton">Logout</button>
    </header>

    <main>
        <h1 id="welcomeMessage">Welcome!</h1>
        <p>You have successfully logged in.</p>
        <p id="statusMessage">Checking your session...</p>
    </main>

    <script src="/dashboard.js"></script>
</body>
</html>
